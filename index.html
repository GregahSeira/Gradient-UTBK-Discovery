/* TOKEN GRADIENT UTBK. Nilai hex yang ditandai (est) adalah perkiraan sampai styles-*.css asli tersedia. Ganti di sini saja. */
@custom-variant dark (&:where(.dark, .dark *));
@theme {
  --font-nunito: 'Nunito', system-ui, sans-serif;

<style id="cardcss">
/* ===== KARTU SHARE (aset baru). Lebar 360, diekspor 3x = 1080px. Warna hex polos agar aman untuk html2canvas ===== */
.sc{width:360px;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;border-radius:26px;font-family:'Nunito',system-ui,sans-serif;color:#fff;position:relative;line-height:1.35}
.sc,.sc *{box-sizing:border-box}
.sc svg{display:inline-block;vertical-align:middle}
.sc>*{flex-shrink:0}
.sc .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sc .bd{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;gap:14px}
.sc .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sc .wm{display:flex;align-items:center;gap:6px;line-height:20px;font-family:'Urbanist',sans-serif;font-weight:800;font-size:17px;color:#fff}
.sc .wm .o{border-radius:99px;padding:1px;height:18px;background:linear-gradient(315deg,#F6EDFE,#998DEB,#604DBD)}
.sc .wm .i{border-radius:99px;display:block;height:16px;line-height:19px;text-align:center;padding:0 8px;background:linear-gradient(90deg,#32257C,#4442B1,#5F6BDF);font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;letter-spacing:.02em}
.sc .sm{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.sc .who{font-weight:800;font-size:13px;color:rgba(255,255,255,.8)}
.sc .cp{display:inline-block;white-space:nowrap;background:rgba(255,255,255,.1);border-radius:99px;padding:0 11px 0 8px;font-weight:800;font-size:12px;line-height:26px;height:26px}
.sc .cp svg,.sc .cp img{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px}
.sc .mline{display:flex;gap:8px;align-items:baseline;font-size:13px;font-weight:700}
.sc .stag{flex:none;display:inline-block;font-weight:800;font-size:11px;color:#181428;background:var(--c);border-radius:5px;padding:1px 6px}
.sc .mbar{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.sc .mbar i{display:block;height:100%;border-radius:99px;background:var(--c,#8753f5)}
.sc h3{margin:0;font-family:'Urbanist',sans-serif;font-weight:800}
.c-log{background:#181428;border:2px solid #221c38}
.c-log h3{font-size:22px;line-height:1.1}
.c-log .lr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.c-log .lr{display:flex;flex-direction:column;gap:5px;border-top:2px dashed #3a3350;padding-top:9px}
.c-log .lr .l{display:flex;justify-content:space-between;font-size:13px;color:#9e98b3;font-weight:700}
.c-log .lr .v{font-size:18px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.c-stat{background:linear-gradient(170deg,#2b2542,#181428)}
.c-stat .tiles{display:grid;gap:8px}
.c-stat .tile{background:rgba(255,255,255,.07);border:2px solid #221c38;border-radius:12px;padding:8px 11px}
.c-stat .tile b{display:block;font-size:23px;font-weight:800;line-height:1.1}
.c-stat .tile span{font-size:12px;color:rgba(255,255,255,.6);font-weight:700}
.c-stat .ch{display:flex;align-items:flex-end;gap:7px;height:62px}
.c-stat .ch div{flex:1;border-radius:6px 6px 2px 2px;background:#3a3350;min-height:3px}
.c-stat .ch div.on{background:linear-gradient(180deg,#895ce9,#5f2bce)}
.c-stat .ch div.td{background:linear-gradient(180deg,#fde68a,#ffb020)}
.c-stat .cl{display:flex;gap:7px;font-size:10px;color:rgba(255,255,255,.7);font-weight:700}
.c-stat .cl span{flex:1;text-align:center}
.c-stat .stk{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.c-stat .stk i{display:block;height:100%}
.c-stat .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:rgba(255,255,255,.8)}
.c-stat .lg em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}
.c-post{background:linear-gradient(160deg,#33246e 0%,#5f2bce 55%,#8753f5 100%)}
.c-post .big{font-family:'Urbanist',sans-serif;font-weight:900;font-size:72px;line-height:1;padding-bottom:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.c-post .big small{font-size:28px;font-weight:800;letter-spacing:0;line-height:1}
.c-post .lead{font-family:'Urbanist',sans-serif;font-weight:800;font-size:15px;color:#e5dcff;margin-bottom:6px}
.c-post .ln{font-family:'Urbanist',sans-serif;font-weight:800;font-size:20px;line-height:1.15}
.c-post .ln small{display:block;font-size:13px;font-weight:700;color:#dcd0ff;font-family:'Nunito',sans-serif}
.c-post .cp{background:rgba(255,255,255,.18)}
.c-kam{background:linear-gradient(160deg,#005aab 0%,#0b3f86 55%,#33246e 100%)}
.c-kam h3{font-size:23px;line-height:1.08}
.c-kam .kk{font-weight:900;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.55)}
.c-kam .ms{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:8px;font-size:11px;font-weight:800}
.c-kam .ms b{font-weight:800;text-align:right}
.c-kam .sline{display:flex;gap:6px;flex-wrap:wrap;font-weight:800;font-size:13px}
.c-kam .sline span{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px}
/* auto-padat */
.sc.d1{padding:16px;gap:9px}
.d1 .bd{gap:9px}.d1 h3{font-size:19px!important}.d1 .lr{padding-top:6px;gap:3px}.d1 .lr .v{font-size:15px}.d1 .lr .l{font-size:12px}
.d1 .mline{font-size:12px}.d1 .tile b{font-size:18px}.d1 .tile{padding:6px 9px}.d1 .ch{height:40px}.d1 .big{font-size:56px}
.d1 .ln{font-size:17px}.d1 .ln small{font-size:11px}.d1 .ms{font-size:10px}.d1 .cp{padding:0 8px 0 6px;font-size:11px;height:22px;line-height:22px}.d1 .ft{gap:6px}.d1 .sm{font-size:11px}.d1 .lg{font-size:11px;gap:8px}
.sc.d2{padding:14px;gap:6px}
.d2 .bd{gap:6px}.d2 .bd>div{gap:4px!important}.d2 .mline:nth-child(n+3){display:none}.d2 .lr .v{font-size:13px}.d2 .ch{height:26px}.d2 .big{font-size:44px}
.d2 .ln small{display:none}.d2 .wm{font-size:14px}.d2 .sline span{padding:3px 7px;font-size:11px}.d2 .tile span{font-size:10px}.d2 .tile b{font-size:15px}
.d2 .mbar{height:5px}.c-kam.d2 .ms{font-size:9px}.c-kam.d2 h3{font-size:16px!important}.c-kam.d2 .bd>div{gap:3px!important}.c-kam.d2 .sline span{padding:2px 6px}
.c-kam.d1 .bd>div>.sm{display:none}.c-kam.d1 .kk{display:none}
</style>

function diffRows(P){const tot=Object.values(P.diff).reduce((a,[t])=>a+t,0)||1;return Object.entries(P.diff).filter(([,[t]])=>t>0).map(([n,[t,b]])=>`<div style="display:grid;grid-template-columns:50px 1fr 64px;gap:8px;align-items:center;font-size:12px;font-weight:800"><span>${n}</span><div class="mbar"><i style="width:${t/tot*100}%;--c:${DIFFC[n]}"></i></div><b style="font-weight:800;text-align:right">${t} · ${pct(b,t)}%</b></div>`).join('')||'<div class="sm">Belum ada soal</div>'}
function foot(d,f,s,opts={}){
 const out=[];
 if(f.streak&&!opts.noStreak)out.push(`<span class="cp">${px('flame',16)}${d.streak} hari streak</span>`);
 if(f.level)out.push(`<span class="cp">${px('lvl',16)}Lv ${d.level}<span style="opacity:.6">·</span>${px('coin',16)}${d.exp} EXP</span>`);

 if(f.badge){const bl=s.badge?d.badges.filter(b=>b.id===s.badge):earned().slice(0,3);bl.forEach(b=>out.push(`<span class="cp">${px('lvl',16)}${esc(b.name)}</span>`))}

const TPL={
 log:(d,P,f,s)=>`<div class="sc c-log" style="height:${RATIO[s.ratio]}px"><div class="hd">${wm}${f.username?`<span class="who">${who(f,d)}</span>`:''}</div>

  </div>${foot(d,f,s)}</div>`,
 stat:(d,P,f,s)=>{const mx=Math.max(...d.days,1);const tiles=[];

  if(f.soal){tiles.push(`<div class="tile"><span>Soal</span><b>${P.soal}</b></div>`,`<div class="tile"><span>Akurasi</span><b>${pct(P.benar,P.soal)}%</b></div>`)}
  const tot=Object.values(P.diff).reduce((a,[t])=>a+t,0)||1;
  return `<div class="sc c-stat" style="height:${RATIO[s.ratio]}px"><div class="hd">${wm}${f.username?`<span class="who">${who(f,d)}</span>`:''}</div>
  <div class="sm">${P.label} · ${P.range}</div>
  <div class="bd">${tiles.length?`<div class="tiles" style="grid-template-columns:repeat(${tiles.length},1fr)">${tiles.join('')}</div>`:''}
   ${f.durasi?`<div><div class="ch">${d.days.map((v,i)=>`<div class="${(P.key==='week'&&i<6&&v)?'on':(i===6?'td':'')}" style="height:${Math.max(4,v/mx*100)}%"></div>`).join('')}</div><div class="cl">${DAYS.map(x=>`<span>${x[0]}</span>`).join('')}</div></div>`:''}
   ${f.kesulitan?`<div style="display:flex;flex-direction:column;gap:7px"><div class="stk">${Object.entries(P.diff).filter(([,[t]])=>t>0).map(([n,[t]])=>`<i style="width:${t/tot*100}%;background:${DIFFC[n]}"></i>`).join('')}</div><div class="lg">${Object.entries(P.diff).filter(([,[t]])=>t>0).map(([n,[t,b]])=>`<span><em style="background:${DIFFC[n]}"></em>${n} ${t} (${pct(b,t)}%)</span>`).join('')||'<span>Belum ada soal</span>'}</div></div>`:''}
   ${f.materi?`<div style="display:flex;flex-direction:column;gap:5px">${matLines(P,3)}</div>`:''}</div>${foot(d,f,s)}</div>`},
 post:(d,P,f,s)=>{const hero=f.durasi?(P.sec<60?P.sec+'<small> dtk</small>':fmtDur(P.sec).replace(/(\d+)j/,'$1<small>j</small>').replace(/(\d+)m/,'$1<small>m</small>')):f.soal?`${P.soal}<small> soal</small>`:`${d.streak}<small> hari</small>`;

 kam:(d,P,f,s)=>{const stats=[];if(f.durasi)stats.push(`<span>${fmtDur(P.sec)}</span>`);if(f.soal)stats.push(`<span>${P.soal} soal</span>`,`<span>${pct(P.benar,P.soal)}% benar</span>`);
  return `<div class="sc c-kam" style="height:${RATIO[s.ratio]}px"><div class="hd">${wm}${f.username?`<span class="who">${who(f,d)}</span>`:''}</div>

function makeCaption(){
 const d=D(),s=S.st,P=d[s.period],f=s.flags,L=[];
 L.push(s.period==='week'?'update belajar minggu ini':s.period==='day'?'update belajar hari ini':'abis latihan soal');
 if(f.durasi)L.push(`- ${fmtDur(P.sec)} belajar`);
 if(f.soal)L.push(`- ${P.soal} soal${P.soal?` (${pct(P.benar,P.soal)}% benar)`:''}`);
 if(f.materi&&P.subtes.length)L.push(`- materi: ${P.subtes.map(x=>x.k).join(', ')}`);
 if(f.kesulitan&&P.diff.Sulit[0])L.push(`- ${P.diff.Sulit[0]} soal level sulit, ${P.diff.Sulit[1]} bener`);
 if(f.streak)L.push(`- streak ${d.streak} hari`);
 if(f.badge){const b=s.badge?d.badges.find(x=>x.id===s.badge):earned()[0];if(b)L.push(`- badge baru: ${b.name}`)}
 if(f.kampus)L.push(`\ntarget: ${d.kampus.ptn.replace('Universitas Indonesia','UI')} ${d.kampus.prodi}. pelan2 asal konsisten`);
 L.push('\n#studytwt #UTBK2027 #GradientUTBK');
 return L.join('\n');
}

async function saveBlob(blob,name){
 try{const dl=window.claude?.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true;
}
async function cardToCanvas(el,w,h,scale){
 const clone=el.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/1999/xhtml');clone.style.zoom='';
 const xml=new XMLSerializer().serializeToString(clone);
 const css=$('#cardcss').textContent;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><foreignObject width="100%" height="100%"><style xmlns="http://www.w3.org/1999/xhtml">${FONTCSS}${css}</style>${xml}</foreignObject></svg>`;
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('SVG gagal dirender'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;
}
async function exportPng(){
 const btn=$('[data-act="save-img"]');btn.disabled=true;const old=btn.textContent;btn.textContent='Membuat gambar...';
 try{
  const st=$('#stage');st.innerHTML=cardHTML(S.dense||0);const el=st.firstElementChild;
  await (document.fonts&&document.fonts.ready);
  const w=360,h=RATIO[S.st.ratio];let c;
  try{c=await cardToCanvas(el,w,h,3)}catch(e1){
   if(typeof html2canvas==='undefined')throw e1;
   c=await html2canvas(el,{scale:3,backgroundColor:null,useCORS:true,logging:false});
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const ok=await saveBlob(blob,`gradient-progress-${S.st.period}-${S.st.tpl}.png`);
  log('simpan gambar: '+S.st.tpl+' '+S.st.ratio);if(ok)toast('Gambar siap disimpan');
 }catch(e){toast('Gagal membuat gambar: '+(e.message||e))}
 btn.disabled=false;btn.textContent=old;
}

 {k:'tpl',q:'Gaya kartu mana yang paling kamu pakai?',o:['Study Log','Statistik','Poster','Menuju Kampus','Belum ada yang cocok']},
 {k:'data',q:'Data apa yang paling pengen kamu tunjukin?',multi:1,o:['Durasi belajar','Jumlah soal','Materi','Tingkat kesulitan','Streak','Kampus impian','Badge','Level','Akurasi']},
 {k:'freq',q:'Seberapa sering kamu bakal pakai ini?',o:['Tiap hari','Tiap minggu','Sesekali','Nggak bakal']},
 {k:'privacy',q:'Soal privasi, kamu nyaman kalau...',multi:1,o:['Username tampil','Akurasi tampil','Kampus impian tampil','Semua harus bisa disembunyiin']}
];
function fbModal(){
 return `<div class="${DLG} sm:max-w-155" role="dialog" aria-label="Kasih masukan"><div class="flex items-center gap-3 border-b-2 border-midnight-850 px-5 py-4"><h2 class="font-nunito flex-1 text-lg font-extrabold">Kasih masukan</h2>${closeBtn('modal-x')}</div>
 <div id="fbscroll" class="flex flex-col overflow-y-auto p-5"><p class="font-nunito-sans text-[13px] font-semibold text-[#9e98b3] pb-2">Jawab singkat, lalu salin dan kirim ke DM atau reply pembuat prototype. Tanpa daftar akun.</p>
 ${FB.map(x=>`<div class="border-midnight-850 flex flex-col gap-2.5 border-b-2 py-4"><h3 class="font-nunito text-[15px] font-extrabold">${x.q}</h3><div class="flex flex-wrap gap-2">${x.o.map(o=>{const cur=S.fb[x.k]||(x.multi?[]:'');const on=x.multi?cur.includes(o):cur===o;return `<button type="button" data-act="fb" data-k="${x.k}" data-v="${esc(o)}" data-multi="${x.multi?1:0}" aria-pressed="${on}" class="${on?CAT_ON:CAT_OFF}">${o}</button>`}).join('')}</div></div>`).join('')}
 <div class="flex flex-col gap-2.5 py-4"><h3 class="font-nunito text-[15px] font-extrabold">Apa yang kurang atau pengen kamu tambahin?</h3><textarea id="fbnote" class="${FOCUS} font-nunito-sans min-h-24 w-full resize-y rounded-xl border-2 border-midnight-700 bg-midnight-800 p-3 text-sm font-semibold text-white" placeholder="Misal: pengen ada stiker, mode polos, tema terang...">${esc(S.fb.note||'')}</textarea></div>
 <button type="button" data-act="fb-copy" class="${BTN_PRI} !py-3 !text-sm">Salin jawaban</button></div></div>`;
}
function fbText(){
 const f=S.fb;const L=['Masukan prototype Share Progress Gradient'];
 FB.forEach(x=>{const v=f[x.k];L.push(`${x.q} ${x.multi?(v&&v.length?v.join(', '):'-'):(v||'-')}`)});
 L.push('Catatan: '+(f.note||'-'));
 L.push('Aktivitas di prototype: '+(S.log.length?S.log.slice(-15).join(' > '):'-'));
 return L.join('\n');
}

/* ============ EVENTS ============ */
document.addEventListener('input',e=>{
 if(e.target.id==='cap'){S.st.caption=e.target.value;S.st.dirty=true;updateX()}
 if(e.target.id==='fbnote'){S.fb.note=e.target.value;saveFb()}
});
function saveFb(){try{localStorage.setItem('gsp-fb',JSON.stringify(S.fb))}catch(e){}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,v=t.dataset.v,s=S.st;
 if(t.tagName==='A'&&a!=='x-share')e.preventDefault();
 const restudio=()=>{if(!s.dirty)s.caption=makeCaption();renderStudio()};
 switch(a){
  case 'persona':S.persona=v;s.caption=makeCaption();render();break;
  case 'nav':if(v==='mastery'){S.page='latsol';render()}else if(v==='profil'){S.page='profil';render()}else toast('Menu ini di luar prototype');break;
  case 'tab':S.tab=v;render();break;
  case 'range':S.range=+v;render();break;
  case 'ach-cat':S.achCat=v;render();break;
  case 'toast':toast(v);break;
  case 'banner-x':S.banner=false;render();break;
  case 'open-studio':openStudio(t.dataset.origin,t.dataset.period,t.dataset.badge);break;
  case 'close-studio':closeStudio();break;
  case 'sim-sesi':$('#modal').innerHTML=resultModal();$('#modal').hidden=false;log('selesai sesi latihan (demo)');break;
  case 'modal-x':$('#modal').hidden=true;break;
  case 'period':s.period=v;restudio();log('periode: '+v);break;
  case 'tpl':s.tpl=v;restudio();log('gaya: '+v);break;
  case 'ratio':s.ratio=v;restudio();log('ukuran: '+v);break;
  case 'flag':s.flags[v]=s.flags[v]?0:1;if(v==='badge'&&!s.flags.badge)s.badge=null;restudio();log('data '+v+': '+(s.flags[v]?'on':'off'));break;
  case 'cap-reset':s.dirty=false;s.caption=makeCaption();renderStudio();break;
  case 'priv':s.privacy=v;renderStudio();log('privasi link: '+v);break;
  case 'copy-cap':toast(await copyText(s.caption)?'Caption disalin':'Gagal menyalin, blok teks lalu salin manual');log('salin caption');break;
  case 'copy-link':toast(await copyText('https://'+profileLink())?'Link disalin':'Gagal menyalin');log('salin link');break;
  case 'x-share':log('bagikan ke X');break;
  case 'save-img':exportPng();break;
  case 'fb-open':$('#modal').innerHTML=fbModal();$('#modal').hidden=false;break;
  case 'fb':{const k=t.dataset.k;if(t.dataset.multi==='1'){const c=S.fb[k]||[];S.fb[k]=c.includes(v)?c.filter(x=>x!==v):c.concat(v)}else S.fb[k]=S.fb[k]===v?'':v;saveFb();const y=$('#fbscroll').scrollTop;$('#modal').innerHTML=fbModal();$('#fbscroll').scrollTop=y;break}
  case 'fb-copy':toast(await copyText(fbText())?'Jawaban disalin, kirim ke DM ya':'Gagal menyalin');break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)$('#modal').hidden=true;else if(!$('#studio').hidden)closeStudio()}});
S.st.caption=makeCaption();render();
</script>
