function mRows(d,P,lv){
 const got=P.materi||[],own=(d.week&&d.week.materi&&d.week.materi.length)?d.week.materi:[];
 const M=(MATS.week||[]).map(([k,n,,, ,fr,to])=>{const g=got.find(x=>x.k===k&&x.n===n);if(g)return g;const o=own.find(x=>x.k===k&&x.n===n);const v=o?o.to:0;return {k,n,sec:0,soal:0,benar:0,from:v,to:v}});
 if(lv==='sub'){const md=P.mdel||{};return Object.keys(d.mastery).map(k=>{const to=d.mastery[k]||0,dl=md[k]||0,st=(P.subtes||[]).find(x=>x.k===k);return {k,name:SUB[k].n,from:Math.max(to-dl,0),to,soal:st?st.soal:0,sec:st?st.sec:0}}).sort(SRT)}
 if(lv==='chap'){const g={};M.forEach(x=>{const c=CHAP[x.n]||x.n,key=x.k+'|'+c;const o=g[key]||(g[key]={k:x.k,name:c,soal:0,sec:0,f:0,t:0});o.soal+=x.soal;o.sec+=x.sec||0;o.f+=x.from*x.soal;o.t+=x.to*x.soal});return Object.values(g).map(o=>{const n=M.filter(x=>x.k===o.k&&(CHAP[x.n]||x.n)===o.name),w=o.soal||0;const av=(f)=>Math.round(w?o[f]/w:n.reduce((a,x)=>a+x[f==='f'?'from':'to'],0)/(n.length||1));return {k:o.k,name:o.name,soal:o.soal,sec:o.sec,from:av('f'),to:av('t')}}).sort(SRT)}
 return M.map(x=>({k:x.k,name:x.n,from:x.from,to:x.to,soal:x.soal,sec:x.sec||0})).sort(SRT)}
const effLvl=(d,P,s)=>s.mlevelSet?(s.mlevel||'subchap'):((P.materi||[]).filter(x=>x.soal>0).length>=3?'subchap':'sub');

function makeCaption(){
 const s=S.st,[d,P,sc]=applyScope(D(),D()[s.period],s),f=s.flags,L=[],wk=P.key==='week',act=d.days.filter(x=>x>0).length;
 L.push(wk?'update belajar minggu ini':P.key==='day'?'update belajar hari ini':'abis latihan soal');
 if(sc)L.push(`fokus: ${sc.lbl}`);
 let x=`- ${fmtDur(P.sec)} belajar`;if(f.growth&&wk&&!sc&&d.lastWeekSec>0){const df=P.sec-d.lastWeekSec;x+=` (${df>=0?'+':'-'}${fmtDur(Math.abs(df))} dari minggu lalu)`}if(f.durasi)L.push(x);
 if(f.soal)L.push(f.benar?`- ${P.soal} soal, ${P.benar} benar (${pct(P.benar,P.soal)}%)`:`- ${P.soal} soal${P.soal?` (${pct(P.benar,P.soal)}% benar)`:''}`);
 if(f.materi&&P.subtes.length)L.push(`- subtes: ${P.subtes.map(x=>x.k).join(', ')}`);
 if(s.tpl==='materi'&&(P.materi||[]).length){const tm=P.materi.slice().sort((a,b)=>b.sec-a.sec).slice(0,3);L.push(`- ${P.materi.length} materi, terlama: ${tm.map(x=>x.n).join(', ')}`)}
 if(f.streak)L.push(`- streak ${d.streak} hari`);
 if(f.aktif)L.push(`- aktif ${act}/7 hari`);
 if(f.growth){const up=(P.skills||[]).filter(x=>x.to>x.from).sort((a,b)=>(b.to-b.from)-(a.to-a.from)).slice(0,3);if(up.length){L.push('- mastery naik:');up.forEach(x=>L.push(`  ${x.name} ${x.from}% ke ${x.to}% (+${x.to-x.from}%)`))}}
 if(f.kesulitan&&P.diff.Sulit[0])L.push(`- ${P.diff.Sulit[0]} soal level sulit, ${P.diff.Sulit[1]} bener`);
 if(f.level)L.push(`- Lv ${d.level}, ${rp(d.exp)} EXP`);
 if(f.badge){const bn=s.badge||(d.hof[0]||earned()[0]||{}).name;if(bn)L.push(`- badge: ${bn}`)}
 if(f.kampus)L.push(`\ntarget: ${d.kampus.short} ${d.kampus.prodi}. pelan2 asal konsisten`);
 L.push('\n#studytwt #UTBK2027 #GradientUTBK');
 return L.join('\n');
}

function fitPreview(){
 const s=S.st,pv=$('#pv');if(!pv)return;

 const pin=$('#pvin');
 const fits=()=>{const c=pin.firstElementChild;return c.scrollHeight<=c.clientHeight+1};
 S.nr=s.mcount||99;pin.innerHTML=cardHTML(0);const tot=pin.querySelectorAll('.mr2').length;
 if(!s.mcount&&!fits()&&tot>1){for(S.nr=tot-1;S.nr>1;S.nr--){pin.innerHTML=cardHTML(0);if(fits())break}}
 const tryFit=()=>{let l=0;for(;l<=2;l++){pin.innerHTML=cardHTML(l);if(fits())return l}return 3};
 if(s.autoStory&&s.ratio==='9:16'){s.ratio='3:4';if(tryFit()===3){s.ratio='9:16'}else s.autoStory=false}
 let lv=tryFit();
 if(lv===3&&s.mcount&&s.ratio==='3:4'){s.ratio='9:16';s.autoStory=true;lv=tryFit()}
 pin.innerHTML=cardHTML(lv);
 S.dense=lv;updateLinks();
 const aw=Math.min($('#sbody').clientWidth-8,360),ah=Math.min(innerHeight*(s.open?.34:.5),460);
 pin.style.zoom=Math.min(1,aw/360,ah/(s.ratio==='auto'||lv>=3?pin.firstElementChild.offsetHeight:RATIO[s.ratio]));
 const card=pin.firstElementChild;
 $('#pvwarn').innerHTML=(s.autoStory?`<p class="font-nunito-sans text-center text-xs font-semibold text-[#b79cff]">Ukuran otomatis jadi 9:16 (Story) supaya ${s.mcount} baris muat</p>`:'')+(card.scrollHeight>card.clientHeight+2?`<p class="font-nunito rounded-xl bg-[#3a2a0a] px-3 py-2 text-[13px] font-bold text-[#fde68a]">Isinya terlalu banyak untuk ukuran ini. Matikan beberapa data atau pilih ukuran lebih tinggi.</p>`:(lv>=3?`<p class="font-nunito-sans text-center text-xs font-semibold text-[#9e98b3]">Teks dikecilkan dan kartu dipanjangkan sedikit supaya semua data muat</p>`:lv?`<p class="font-nunito-sans text-center text-xs font-semibold text-[#9e98b3]">Teks dikecilkan otomatis biar muat</p>`:''));
}

function updateLinks(){shareLink();const sp=$('#slugpill'),sh=$('#slughint'),sn=S.snaps[S.st.slug];if(sp)sp.textContent=shareLink();if(sh)sh.textContent=sn?'Link ini sudah dibagikan. Isinya dibekukan, tidak ikut berubah.':S.st.regen?'Kartu diubah, jadi link baru dibuat. Link lama tetap menampilkan versi lama.':'Link acak, tanpa nama atau akunmu. Isinya dibekukan saat kamu bagikan.';const x=$('#xlink'),w=$('#wa');if(x)x.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(S.st.caption)+'&url='+encodeURIComponent('https://'+shareLink());if(w)w.href='https://wa.me/?text='+encodeURIComponent(shareText())}
async function saveBlob(blob,name){
 try{const dl=window.claude?.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true;
}
async function cardToCanvas(el,w,h,scale){
 const clone=el.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/1999/xhtml');clone.style.zoom='';
 const xml=new XMLSerializer().serializeToString(clone);
 const css=$('#cardcss').textContent;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><foreignObject width="100%" height="100%"><style xmlns="http://www.w3.org/1999/xhtml">${FONTCSS}${css}</style>${xml}</foreignObject></svg>`;
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('SVG gagal dirender'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;
}
async function exportPng(quiet){
 try{
  const st=$('#stage');st.innerHTML=cardHTML(S.dense||0);const el=st.firstElementChild;
  await (document.fonts&&document.fonts.ready);
  const w=360,h=S.st.ratio==='auto'||(S.dense||0)>=3?Math.ceil(el.getBoundingClientRect().height)||480:RATIO[S.st.ratio];let c;
  try{c=await cardToCanvas(el,w,h,3)}catch(e1){
   if(typeof html2canvas==='undefined')throw e1;
   c=await html2canvas(el,{scale:3,backgroundColor:null,useCORS:true,logging:false});
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const ok=await saveBlob(blob,`gradient-progress-${S.st.period}-${S.st.tpl}.png`);
  log('simpan gambar: '+S.st.tpl+' '+S.st.ratio);return ok;
 }catch(e){toast('Gagal membuat gambar: '+(e.message||e));return false}
}

  case 'ch-tw':freeze();updateLinks();log('bagikan ke X');break;
  case 'ch-ig':{freeze();updateLinks();const ok=await exportPng();if(ok)toast('Gambar tersimpan. Buka Instagram, lalu pilih dari galeri untuk Story');log('bagikan ke Instagram (simpan gambar)');break}
  case 'ch-cp':freeze();updateLinks();toast(await copyText('https://'+shareLink())?'Tautan tersalin':'Gagal menyalin tautan');log('salin tautan');break;
  case 'ch-more':{freeze();updateLinks();let done=false;try{if(navigator.share){await navigator.share({text:S.st.caption,url:'https://'+shareLink()});done=true}}catch(e){}if(!done){const ok=await exportPng();if(ok)toast('Aplikasi tidak tersedia. Gambar disimpan, kirim manual')}log('bagikan lewat Lainnya');break}
  case 'modal-x':$('#modal').hidden=true;break;
  case 'period':s.period=v;restudio();log('periode: '+v);break;
  case 'tpl':s.tpl=v;s.preset=v;restudio();log('gaya: '+v);break;
  case 'scope-sub':{const a=s.scope.subtes;s.scope.subtes=a.includes(v)?a.filter(x=>x!==v):a.concat(v);if(s.scope.subtes.length!==1)s.scope.materi='';restudio();log('fokus subtes: '+s.scope.subtes.join(','));break}
  case 'mlevel':s.mlevel=v;s.mlevelSet=true;s.mcount=0;restudio();log('tingkat mastery: '+v);break;
  case 'msub':s.msub=v;restudio();log('subtes: '+v);break;
  case 'scope-clear':s.scope={subtes:[],materi:''};restudio();log('fokus dihapus');break;
  case 'preset':{s.preset=v;s.tpl=v==='custom'?'rapor':v;s.ratio=v==='custom'?'auto':'3:4';if(v==='custom')s.open=true;else{const kp=s.flags.kampus,sk=s.flags.sekolah;s.flags={...DEFF,kampus:kp,sekolah:sk};s.badge=null}restudio();log('gaya: '+v);break}
  case 'theme':s.theme=v;renderStudio();log('tema: '+v);break;
  case 'ratio':s.ratio=v;s.autoStory=false;s.mcount=0;restudio();log('ukuran: '+v);break;
  case 'flag':s.flags[v]=s.flags[v]?0:1;if(v==='badge'&&!s.flags.badge)s.badge=null;restudio();log('data '+v+': '+(s.flags[v]?'on':'off'));break;
  case 'cap-reset':s.dirty=false;s.caption=makeCaption();renderStudio();break;
  case 'priv':s.privacy=v;renderStudio();log('privasi link: '+v);break;
  case 'save-img':{const ok=await exportPng();if(ok)toast('Gambar siap disimpan');break}
  case 'fb-open':$('#modal').innerHTML=fbModal();$('#modal').hidden=false;break;
  case 'fb':{const k=t.dataset.k;if(t.dataset.multi==='1'){const c=S.fb[k]||[];S.fb[k]=c.includes(v)?c.filter(x=>x!==v):c.concat(v)}else S.fb[k]=S.fb[k]===v?'':v;saveFb();const y=$('#fbscroll').scrollTop;$('#modal').innerHTML=fbModal();$('#fbscroll').scrollTop=y;break}
  case 'fb-copy':toast(await copyText(fbText())?'Jawaban disalin, kirim ke DM ya':'Gagal menyalin');break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)$('#modal').hidden=true;else if(!$('#studio').hidden)closeStudio()}});
S.st.caption=makeCaption();render();
</script>
